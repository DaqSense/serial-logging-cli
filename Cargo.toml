[package]
name = "serial-logging-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A tiny cross-platform CLI for capturing raw serial output to text or line-based CSV logs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/DaqSense/serial-logging-cli"
keywords = ["serial", "logger", "arduino", "csv", "cli"]
categories = ["command-line-utilities", "hardware-support"]

[dependencies]
anyhow = "1.0.103"
chrono = "0.4.45"
clap = { version = "4.6.2", features = ["derive"] }
csv = "1.4.0"
ctrlc = "3.5.2"
serialport = { version = "4.9.0", default-features = false }

[dev-dependencies]
tempfile = "3.24.0"

[profile.release]
lto = "thin"
strip = true
